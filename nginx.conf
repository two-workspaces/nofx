# NOFX web UI and API on one port; the backend listens on 127.0.0.1:8081.
server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location ~ ^/(frontier|planning/?)$ { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # Upstream's /health is a static 200; this one answers only when the backend does.
    location = /health { proxy_pass http://127.0.0.1:8081/api/health; access_log off; }
}
